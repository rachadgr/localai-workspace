name: Build ASAF AI APK

# Builds the ASAF AI Android application (Flutter) and publishes the APK as a
# downloadable artifact. On a version tag (v*) it also attaches the APK to a
# GitHub Release.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      build_variant:
        description: "APK build variant"
        type: choice
        default: release
        options: [release, debug]

# Least-privilege token; contents:write is only needed to attach a Release.
permissions:
  contents: write

# Cancel superseded runs on the same ref (keeps the queue short).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_variant || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: mobile

    env:
      FLUTTER_VERSION: "3.35.4"
      BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Flutter SDK & pub cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            /opt/hostedtoolcache/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version / doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run tests (non-blocking)
        run: flutter test || true

      - name: Build APK
        run: |
          if [ "$BUILD_VARIANT" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Locate APK(s)
        id: apk
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/ || true
          # Prefer split APKs; fall back to the universal APK.
          if ls build/app/outputs/flutter-apk/*-release.apk >/dev/null 2>&1; then
            echo "upload_path=build/app/outputs/flutter-apk/*-release.apk" >> "$GITHUB_OUTPUT"
          elif ls build/app/outputs/flutter-apk/*-debug.apk >/dev/null 2>&1; then
            echo "upload_path=build/app/outputs/flutter-apk/*-debug.apk" >> "$GITHUB_OUTPUT"
          else
            echo "upload_path=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: asaf-ai-apk-${{ env.BUILD_VARIANT }}
          path: mobile/${{ steps.apk.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
