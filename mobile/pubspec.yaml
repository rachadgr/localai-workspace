name: asaf_ai
description: "ASAF AI — AI Creation & Generation Studio (Android client for the ASAF AI FastAPI backend)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking + state (web-compatible, pinned to sandbox-tested versions)
  http: ^1.5.0
  provider: ^6.1.5+1

  # Local persistence for the session token / server URL
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Ships TestFlutterSecureStoragePlatform so secure-storage behaviour can be
  # unit-tested deterministically.
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
